<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=0">
  <title>Google Photos MVP</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=block">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="device">
    <div class="screen" id="app-root">
       <!-- App UI injected here -->
    </div>
    
    <nav class="bottom-nav">
      <button class="nav-item active" id="nav-photos" onclick="navigate('#/photos')">
        <div class="icon-box"><span class="ms">photo</span></div>
        <span>Photos</span>
      </button>
      <button class="nav-item" id="nav-memories" onclick="alert('Not in MVP')">
        <div class="icon-box"><span class="ms">history</span></div>
        <span>Memories</span>
      </button>
      <button class="nav-item" id="nav-collections" onclick="navigate('#/collections')">
        <div class="icon-box"><span class="ms">photo_library</span></div>
        <span>Library</span>
      </button>
      <button class="nav-item" id="nav-search" onclick="navigate('#/search')">
        <div class="icon-box"><span class="ms">search</span></div>
        <span>Search</span>
      </button>
    </nav>
    
    <div id="viewer-root"></div>
  </main>
  
  <script src="data.js"></script>
  <script src="search.js"></script>
  <script src="app.js"></script>
</body>
</html>
